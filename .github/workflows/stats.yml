name: Refresh demo

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile.config.json"
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build.mjs profile.config.json examples/dreyze

      - name: Commit
        run: |
          if [[ -n "$(git status --porcelain examples/dreyze)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add examples/dreyze
            git commit -m "chore: refresh demo"
            git push
          fi
